<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscript and Superscript</title>
</head>
<body>
  <h1>Superscript</h1>
    a <sup>2</sup> + b <sup>2</sup> = c <sup>2</sup>
    <hr>

  <h1>Subscript</h1>
   H <sub>2</sub>O
  
</body>
</html>
