<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Range in html</title>
  </head>
  <body>
    <form action="/server">
      <div>
        <label for="vol">Select your volume level:</label>
        <input type="range" id="vol" name="vol" min="0" max="100" step="10" value="70" />
      </div>
      <div>
        <label for="feedback">Please provide your valauable feedback:</label>
        <textarea name="feedback" id="feedback" rows="3" cols="50" placeholder="Write your feedback"></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
