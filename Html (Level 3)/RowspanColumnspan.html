<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table </title>
</head>
<body>
  <table border="">
    <caption>Student Data </caption>
    <!-- Table Header -->
    <thead>
      <tr>
        <th rowspan="2">Student Name</th>
        <th colspan="3">Student Detail</th>
      </tr>  
      <tr>
        <th>Roll No</th>
        <th>Marks</th>
        <th>Result</th>
      </tr> 
    </thead>
    <!-- Table Body -->
    <tbody>
      <tr>
        <td>Rohit Kumar</td>
        <td>24</td>
        <td>85%</td>
        <td>Pass</td>
      </tr>
      <tr>
        <td>Aman Singh</td>
        <td>28</td>
        <td>89%</td>
        <td>Pass</td>
      </tr>
      <tr>
        <td>Rajesh Kumar</td>
        <td>26</td>
        <td>28%</td>
        <td>Fail</td>
      </tr>
    </tbody>
    <!-- Table Footer -->
     <!-- Table footer contain footer data like total sum -->
  </table>
  
</body>
</html>
