<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List in Html</title>
</head>
<body>
  <ul>
    <li>Bread</li>
    <li>Jam</li>
    <li>Fruits</li>
  </ul>
  <ol type="i">
    <li>Alpha</li>
    <li>Beta</li>
    <li>Gamma</li>
  </ol>

  <ul>
    <li>Bread
      <ol>
        <li>Brown Bread</li>
        <li>White Bread</li>
      </ol>
    </li>
    <li>Jam</li>
    <li>Milk</li>
    <li>Fruits</li>

  </ul>
</body>
</html>
